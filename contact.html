<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Coffee from all way up the Himalayas.">
  <title>Everest Roast</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Everest Roast</a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <div class="container">
        <h1>Contact us</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Send us a message or come and visit the shop.</p>
      </div>
    </section>

    <section>
      <div class="container contact-layout">
        <div class="contact-form">
          <h2>Send a message</h2>
          <form action="#" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email">

            <label for="message">Message</label>
            <textarea id="message" name="message"></textarea>

            <button class="button" type="submit">Send</button>
          </form>
        </div>

        <div class="contact-info">
          <h2>Find the shop</h2>
          <img src="img/location.png" width="400" height="420" alt="Map showing the shop location">
          <p>Mimiyathuma  12<br> Anpchour<br>Nepal</p>
          <p>Open Mon–Fri 10–18, Sat 10–15</p>
          <p>Phone: 000 000 0000</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Made by Pawan Kharel</p>
  </footer>
</body>
</html>
